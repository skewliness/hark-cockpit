<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net data:; script-src 'unsafe-inline'">
<link rel="stylesheet" href="theme.css">
<style>
body{background:var(--ledge);display:flex;flex-direction:column;overflow:hidden;user-select:none;border-right:1px solid #161C21}
.brand{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;-webkit-app-region:drag}
.mark{width:26px;height:26px;border-radius:8px;background:var(--brass);display:grid;place-items:center}
.brand b{font:400 18px/1 var(--hand);letter-spacing:.5px}
.brand b{white-space:nowrap}
.brand span{font:400 11px/1 var(--sans);color:var(--dim);margin-left:7px;letter-spacing:.2px}
.nav{margin:6px 10px 2px;height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--haze);cursor:pointer;width:calc(100% - 20px);text-align:left;position:relative}
.nav:hover{background:var(--raise);color:var(--paper)}
.nav.on{background:var(--raise);color:var(--paper)}
.nav.on::before,.acc.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brass)}
.sec{display:flex;justify-content:space-between;margin:18px 20px 6px;font-size:12px;color:var(--dim)}
#list{flex:1;overflow:auto;padding:0 10px 10px}
.acc{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;margin-bottom:2px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.acc:hover{background:rgba(44,54,63,.6)}
.acc.on{background:var(--raise)}
.acc .mono-av{width:30px;height:30px;font-size:13px}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim)}
.st.ok{color:var(--jade)}
.st .lamp{width:6px;height:6px}
.st .q{margin-left:6px;color:var(--haze)}.st .q.hot{color:var(--rust)}.acc.on .st .q{color:var(--paper)}
.key{font-size:11px;color:var(--dim)}
.acc:hover .key,.acc.on .key{color:var(--haze)}
.foot{padding:12px;border-top:1px solid #161C21}
.foot .btn{width:100%}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 2px}
#ver{border:0;background:none;color:var(--dim);font-size:12px;cursor:pointer;padding:4px}
#ver:hover{color:var(--paper)}
.tools .ib{width:28px;height:28px}
.note{display:none;margin:0 12px 10px;padding:10px 12px;border-radius:10px;font-size:12.5px;background:var(--raise);border:1px solid var(--seam)}
#upd{border-color:rgba(108,196,161,.45);cursor:pointer}
#upd:hover{background:var(--raise2)}
#menu{position:fixed;display:none;background:var(--raise);border:1px solid var(--seam);border-radius:10px;padding:4px;box-shadow:0 14px 34px rgba(0,0,0,.4);min-width:160px;z-index:10}
#menu div{padding:7px 10px;border-radius:7px;cursor:pointer}
#menu div:hover{background:var(--raise2)}
#menu hr{border:0;border-top:1px solid var(--seam);margin:4px 2px}
#menu .danger{color:var(--rust)}
#dk{display:none;gap:8px;margin-bottom:12px}
#dk label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:8px;border:1px solid var(--seam);background:var(--ledge);cursor:pointer;font-size:13px;color:var(--haze)}
#dk label.on{border-color:var(--brass);color:var(--paper);background:var(--raise)}
#dk input{accent-color:var(--brass)}
</style></head><body>
<div class="brand"><div class="mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="#2A2216"><path d="M4 19c3.5-7 8-11.5 16-14-3 4-4.4 8.3-3.8 14.2C12.4 16.6 8.4 16.7 4 19z"/></svg></div><b>Hark Tools<span>by Miracle AI</span></b></div>
<button class="nav" id="homeBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>总览</button>
<div class="sec"><span>账号</span><span id="cnt">0</span></div>
<div id="list"></div>
<div class="note" id="toast" role="status"></div>
<div class="note" id="upd" role="button" tabindex="0"></div>
<div class="foot">
  <button class="btn pri" id="add"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加账号</button>
  <div class="tools"><button id="ver" title="检查更新"></button>
  <button class="ib" id="chk" title="检查更新"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button></div>
</div>
<div id="dlg"><div class="box"><div class="t" id="dt"></div><input id="di"><div class="b"><button class="btn" id="dc">取消</button><button class="btn pri" id="do">确定</button></div></div></div>
<div id="menu"><div data-a="rename">重命名</div><div data-a="reload">刷新页面</div><hr><div data-a="inboxHere">信箱：在当前打开的项目收信</div><div data-a="inboxChat">信箱：改回在聊天收信</div><hr><div data-a="diag">导出诊断文件</div><hr><div data-a="remove" class="danger">删除并清除登录</div></div>
<script>
const TINTS=[['#3B4A5C','#BFD3EA'],['#2F4A47','#A8DCCB'],['#4A3F57','#D6C5EA'],['#55413F','#EBC3B8'],['#504631','#E8D3A2'],['#3C4A35','#C6DDB0']];
const tint=s=>{let h=0;for(const c of s||'')h=(h*31+c.charCodeAt(0))>>>0;return TINTS[h%TINTS.length]};
function ask(title,def,cb,withInput=true){const i=di,ok=document.getElementById('do');dt.textContent=title;i.style.display=withInput?'':'none';i.value=def||'';dlg.style.display='flex';
 ok.textContent=withInput?'确定':'删除';ok.className='btn '+(withInput?'pri':'danger');if(withInput){i.focus();i.select();}else ok.focus();
 const done=v=>{dlg.style.display='none';ok.onclick=dc.onclick=i.onkeydown=null;if(v!==null)cb(v)};
 ok.onclick=()=>done(withInput?(i.value.trim()||def):true);dc.onclick=()=>done(null);
 i.onkeydown=e=>{if(e.key==='Enter')ok.click();if(e.key==='Escape')dc.click()};}
function askAdd(cb){
  const i=di,ok=document.getElementById('do');
  const defName=()=>' '+(st.accounts.length+1);
  dt.textContent='添加账号';i.style.display='';i.dataset.touched='';i.value='Hark'+defName();
  dlg.style.display='flex';ok.textContent='确定';ok.className='btn pri';i.focus();i.select();
  i.oninput=()=>{i.dataset.touched='1'};
  const done=v=>{dlg.style.display='none';ok.onclick=dc.onclick=i.onkeydown=i.oninput=null;if(v!==null)cb(v)};
  ok.onclick=()=>{const name=i.value.trim()||('Hark'+defName());done({name,kind:'hark'})};
  dc.onclick=()=>done(null);
  i.onkeydown=e=>{if(e.key==='Enter')ok.click();if(e.key==='Escape')dc.click()};
}
const daily=a=>{const b=a.usage&&a.usage.buckets&&(a.usage.buckets.find(x=>/day|daily/.test(x.key))||a.usage.buckets[0]);return b&&b.pct!=null?`<span class="q ${b.pct>=90?'hot':''}">${/day|daily/.test(b.key)?'今日':''}已用 ${b.pct}%</span>`:''};
let st={accounts:[],activeId:null,showHome:false},ctxId=null;
function render(){
  list.innerHTML='';cnt.textContent=st.accounts.length;homeBtn.classList.toggle('on',!!st.showHome);
  st.accounts.forEach((a,i)=>{
    const [bg,fg]=tint(a.name);const el=document.createElement('button');
    el.className='acc'+(!st.showHome&&a.id===st.activeId?' on':'');
    el.innerHTML=`<div class="mono-av" style="background:${bg};color:${fg}"></div><div class="meta"><b></b><div class="st ${a.loggedIn?'ok':''}"><span class="lamp ${a.loggedIn?'on':''}"></span>${a.loggedIn?'已登录':'未登录'}${a.inboxUrl?'<span class="q">项目收信</span>':''}${daily(a)}</div></div>${i<9?`<span class="key">Ctrl ${i+1}</span>`:''}`;
    el.querySelector('.mono-av').textContent=(a.name||'H').trim()[0].toUpperCase();el.querySelector('b').textContent=a.name;
    el.onclick=()=>cockpit.switchTo(a.id);
    el.oncontextmenu=e=>{e.preventDefault();ctxId=a.id;menu.style.left=Math.min(e.clientX,innerWidth-170)+'px';menu.style.top=Math.min(e.clientY,innerHeight-200)+'px';menu.style.display='block'};
    list.appendChild(el);
  });
}
document.onclick=()=>menu.style.display='none';
menu.onclick=e=>{e.stopPropagation();menu.style.display='none';const act=e.target.dataset.a,id=ctxId;if(!act||!id)return;const a=st.accounts.find(x=>x.id===id);
  if(act==='rename')ask('重命名账号',a&&a.name,n=>cockpit.rename(id,n));
  if(act==='reload')cockpit.reload(id);
  if(act==='inboxHere')cockpit.setInbox(id,'here');
  if(act==='inboxChat')cockpit.setInbox(id,'chat');
  if(act==='diag')cockpit.exportDiag();
  if(act==='remove')ask(`删除「${a?a.name:''}」并清除它的登录？`,'',()=>cockpit.remove(id),false);};
add.onclick=()=>askAdd(o=>cockpit.add(o));
homeBtn.onclick=()=>cockpit.home();
document.addEventListener('keydown',e=>{const n=+e.key;if((e.ctrlKey||e.metaKey)&&n>=1&&n<=9&&st.accounts[n-1])cockpit.switchTo(st.accounts[n-1].id);});
cockpit.onState(s=>{st=s;render()});cockpit.getState().then(s=>{st=s;render()});
const showVer=()=>cockpit.version().then(v=>ver.textContent='v'+v);showVer();
const check=async()=>{ver.textContent='正在检查…';const r=await cockpit.checkUpdate();
  ver.textContent=r==='latest'?'已是最新版本':(r==='offline'?'连不上更新服务器':(r==='ready'?'新版本已下载':ver.textContent));setTimeout(showVer,2500);};
ver.onclick=check;chk.onclick=check;
let tt;cockpit.onToast(m=>{toast.textContent=m;toast.style.display='block';clearTimeout(tt);tt=setTimeout(()=>toast.style.display='none',4000);});
cockpit.onUpdate(u=>{if(u.state==='ready'){upd.style.display='block';upd.textContent='v'+u.version+' 已下载，点这里重启更新';upd.onclick=upd.onkeydown=()=>cockpit.installUpdate();}if(u.state==='error')upd.style.display='none';});
</script></body></html>
