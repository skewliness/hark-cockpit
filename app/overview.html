<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{--frost:rgba(255,255,255,.72);--ink:#1D1D1F;--slate:#6E6E73;--faint:#A1A1A6;--line:rgba(0,0,0,.08);--blue:#007AFF;--blue-soft:#E5F0FF;--lagoon:#0891B2;--green:#16A34A;--red:#DC2626}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:13px/1.5 -apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 85% -10%,#DDF1F3 0%,transparent 60%),radial-gradient(900px 500px at 0% 0%,#E7ECFB 0%,transparent 55%),#EEF2F8}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:26px 36px 140px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.3px;background:linear-gradient(100deg,#0062E0,#0E7490);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--slate);margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#C7D4F5;color:var(--blue)}
.btn.pri{background:linear-gradient(180deg,#2F8BFF,#007AFF);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 .5px 0 rgba(255,255,255,.35)}
.btn.pri:hover{filter:brightness(1.05);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:28px}
.stat{background:var(--frost);backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.04)}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat small{color:var(--slate);display:block}
.stat b{font-size:24px;line-height:1.2}
h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 span{font-size:12px;font-weight:400;color:var(--slate)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:32px}
.card{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:#C7D4F5;box-shadow:0 10px 28px rgba(37,99,235,.10)}
.card.on{box-shadow:0 0 0 3px rgba(0,122,255,.35)}
.top{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--faint)}
.pill{font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.ok{background:#E7F6EC;color:#15803D}.pill.no{background:#F1F5F9;color:#64748B}
.pill.cur{background:var(--blue-soft);color:var(--blue);margin-right:4px}
.acts{display:flex;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.acts .open{flex:1;justify-content:center}
.ib{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--slate)}
.ib:hover{color:var(--blue);border-color:#C7D4F5}.ib.del:hover{color:var(--red);border-color:#F8C9C9}
.empty{border:1.5px dashed #C9D3E3;border-radius:16px;padding:36px;text-align:center;color:var(--slate);background:rgba(255,255,255,.45);cursor:pointer}
.empty:hover{border-color:var(--blue);color:var(--blue)}
.guide{background:var(--frost);backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:20px 22px;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.guide p{margin:4px 0 0;color:var(--slate);max-width:32ch}
ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
ol li{counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--slate)}
ol li::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:12px;margin-bottom:6px}
ol li b{display:block;color:var(--ink);margin-bottom:2px}
#dlg{position:fixed;inset:0;background:rgba(26,34,51,.25);display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#dlg .box{background:rgba(246,246,248,.98);padding:20px 18px 16px;border-radius:12px;width:280px;text-align:center;box-shadow:0 0 0 .5px rgba(0,0,0,.15),0 24px 60px rgba(0,0,0,.25);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
#dlg .logo{width:52px;height:52px;margin:0 auto 12px;border-radius:12px;background:linear-gradient(140deg,#2563EB,#0891B2);display:grid;place-items:center}
#dlg .b .btn{flex:1;justify-content:center;padding:6px;border-radius:7px}
#dlg .t{margin-bottom:12px;font-weight:600;font-size:15px}
#dlg input{width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--line);outline:none;font:inherit}
#dlg input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
#dlg .b{display:flex;gap:8px;margin-top:14px}
/* Dock */
.dock-wrap{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;pointer-events:none}
.dock{pointer-events:auto;display:flex;align-items:flex-end;gap:6px;padding:7px 9px 9px;border-radius:22px;height:70px;
  background:rgba(255,255,255,.42);backdrop-filter:blur(28px) saturate(1.8);border:1px solid rgba(255,255,255,.65);box-shadow:0 10px 30px rgba(0,0,0,.12),inset 0 .5px 0 rgba(255,255,255,.8)}
.tile{position:relative;width:50px;height:50px;border:0;padding:0;background:none;cursor:pointer;transform-origin:50% 100%;transition:transform .14s ease-out}
.tile .face{width:100%;height:100%;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.14),inset 0 .5px 0 rgba(255,255,255,.6)}
.tile .dot{position:absolute;left:50%;bottom:-7px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#3A3A3C;opacity:0}
.tile.ok .dot{opacity:.75}
.tile .tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:rgba(40,40,42,.82);color:#fff;font-size:12px;padding:3px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s}
.tile:hover .tip,.tile:focus-visible .tip{opacity:1}
.sep{width:1px;align-self:stretch;margin:4px 4px 2px;background:rgba(0,0,0,.14)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
@media (max-width:900px){.stats{grid-template-columns:1fr 1fr}.guide{grid-template-columns:1fr}ol{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background-color:rgba(0,0,0,.32)}
</style></head><body>
<div class="wrap">
  <header>
    <div><h1>总览</h1><div class="sub">所有 Hark 账号都在这里，点「打开」进入对应的聊天窗口</div></div>
    <button class="btn pri" id="addBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加账号</button>
  </header>
  <section class="stats">
    <div class="stat"><div class="ico" style="background:#E8EFFE;color:#2563EB"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg></div><div><small>账号总数</small><b id="sTotal">0</b></div></div>
    <div class="stat"><div class="ico" style="background:#E7F6EC;color:#16A34A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div><div><small>已登录</small><b id="sOk">0</b></div></div>
    <div class="stat"><div class="ico" style="background:#E0F5F8;color:#0E7490"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></div><div><small>当前版本</small><b id="sVer">–</b></div></div>
  </section>
  <h2>我的账号 <span id="hint">右键侧栏账号也能重命名或删除</span></h2>
  <section class="grid" id="grid"></section>
  <section class="guide">
    <div><h2 style="margin:0">从浏览器导入登录</h2><p>不想在窗口里输入谷歌密码？在 Chrome 登录后一键导入。</p></div>
    <ol>
      <li><b>安装插件</b>chrome://extensions 打开开发者模式，加载 Hark Cockpit 插件</li>
      <li><b>在 Chrome 登录</b>用要导入的谷歌账号打开 app.hark.com 并登录</li>
      <li><b>点插件导入</b>选择目标账号，可勾选实时同步</li>
    </ol>
  </section>
</div>
<div class="dock-wrap"><nav class="dock" id="dock" aria-label="快速切换账号"></nav></div>
<div id="dlg"><div class="box"><div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M4 19c3.5-7 8-11.5 16-14-3 4-4.4 8.3-3.8 14.2C12.4 16.6 8.4 16.7 4 19z"/></svg></div><div class="t" id="dt"></div><input id="di"><div class="b"><button class="btn" id="dc">取消</button><button class="btn pri" id="dok">确定</button></div></div></div>
<script>
const TINTS=[['#E8EFFE','#2563EB'],['#E0F5F8','#0E7490'],['#EDE9FE','#6D28D9'],['#FCE7F3','#BE185D'],['#FEF3C7','#B45309'],['#DCFCE7','#15803D']];
const tint=s=>{let h=0;for(const c of s||'')h=(h*31+c.charCodeAt(0))>>>0;return TINTS[h%TINTS.length]};
const I={open:'<path d="M5 12h14M13 6l6 6-6 6"/>',reload:'<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',del:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'};
const svg=k=>`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
function ask(title,def,cb,withInput=true,okText){dt.textContent=title;di.style.display=withInput?'':'none';di.value=def||'';dlg.style.display='flex';dok.textContent=okText||'确定';if(withInput){di.focus();di.select();}else dok.focus();
 const done=v=>{dlg.style.display='none';dok.onclick=dc.onclick=di.onkeydown=null;if(v!==null)cb(v)};
 dok.onclick=()=>done(withInput?(di.value.trim()||def):true);dc.onclick=()=>done(null);di.onkeydown=e=>{if(e.key==='Enter')dok.click();if(e.key==='Escape')dc.click()};}
const addAcc=()=>ask('给新账号起个名字','Hark '+(st.accounts.length+1),name=>cockpit.add({name}),true,'添加');
addBtn.onclick=addAcc;
let st={accounts:[],activeId:null};
function renderDock(){
  dock.innerHTML='';
  const mk=(label,bg,fg,txt,ok,fn)=>{const b=document.createElement('button');b.className='tile'+(ok?' ok':'');b.setAttribute('aria-label',label);
    b.innerHTML=`<div class="face" style="background:${bg};color:${fg}"></div><span class="dot"></span><span class="tip"></span>`;
    b.querySelector('.face').textContent=txt;b.querySelector('.tip').textContent=label;b.onclick=fn;dock.appendChild(b);return b;};
  st.accounts.forEach(a=>{const [bg,fg]=tint(a.name);mk(a.name+(a.loggedIn?'（已登录）':''),`linear-gradient(160deg,#fff,${bg})`,fg,(a.name||'H').trim()[0].toUpperCase(),a.loggedIn,()=>cockpit.switchTo(a.id));});
  if(st.accounts.length){const s=document.createElement('div');s.className='sep';dock.appendChild(s);}
  mk('添加账号','linear-gradient(160deg,#5AA8FF,#007AFF)','#fff','+',false,addAcc);
}
// Dock 放大效果：靠近鼠标的图标放大，邻近的跟着变大
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
dock.addEventListener('mousemove',e=>{if(reduce)return;for(const t of dock.querySelectorAll('.tile')){const r=t.getBoundingClientRect();const d=Math.abs(e.clientX-(r.left+r.width/2));const s=1+Math.max(0,.55*(1-d/130));t.style.transform=`scale(${s.toFixed(3)})`;t.style.margin=`0 ${((s-1)*14).toFixed(1)}px`;}});
dock.addEventListener('mouseleave',()=>{for(const t of dock.querySelectorAll('.tile')){t.style.transform='';t.style.margin='';}});
function render(){
  renderDock();
  sTotal.textContent=st.accounts.length;sOk.textContent=st.accounts.filter(a=>a.loggedIn).length;
  grid.innerHTML='';
  if(!st.accounts.length){const e=document.createElement('button');e.className='empty';e.style.gridColumn='1/-1';e.textContent='还没有账号，添加第一个 Hark 账号';e.onclick=addAcc;grid.appendChild(e);return;}
  st.accounts.forEach((a,i)=>{
    const [bg,fg]=tint(a.name);const c=document.createElement('div');c.className='card'+(a.id===st.activeId?' on':'');
    c.innerHTML=`<div class="top"><div class="av" style="background:${bg};color:${fg}"></div><div class="nm"><b></b><small>${i<9?'Ctrl '+(i+1)+' 快速切换':'独立会话'}</small></div>
      <div>${a.id===st.activeId?'<span class="pill cur">上次使用</span>':''}<span class="pill ${a.loggedIn?'ok':'no'}">${a.loggedIn?'已登录':'未登录'}</span></div></div>
      <div class="acts"><button class="btn open">${svg('open')}${a.loggedIn?'打开聊天':'去登录'}</button>
      <button class="ib" data-k="reload" title="刷新页面">${svg('reload')}</button><button class="ib" data-k="edit" title="重命名">${svg('edit')}</button><button class="ib del" data-k="del" title="删除并清除登录">${svg('del')}</button></div>`;
    c.querySelector('.av').textContent=(a.name||'H').trim()[0].toUpperCase();c.querySelector('b').textContent=a.name;
    c.querySelector('.open').onclick=()=>cockpit.switchTo(a.id);
    c.querySelector('[data-k=reload]').onclick=()=>cockpit.reload(a.id);
    c.querySelector('[data-k=edit]').onclick=()=>ask('重命名账号',a.name,n=>cockpit.rename(a.id,n));
    c.querySelector('[data-k=del]').onclick=()=>ask(`删除「${a.name}」并清除它的登录？`,'',()=>cockpit.remove(a.id),false,'删除');
    grid.appendChild(c);
  });
}
cockpit.onState(s=>{st=s;render()});
cockpit.getState().then(s=>{st=s;render()});
cockpit.version().then(v=>sVer.textContent='v'+v);
</script></body></html>
