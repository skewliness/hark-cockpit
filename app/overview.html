<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net data:; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="theme.css">
<style>
body{background:var(--dusk);overflow:auto}
.wrap{max-width:980px;margin:0 auto;padding:40px 40px 56px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hello .pic{width:160px;height:100px;flex:none}
.hello b{display:block;font:400 22px/1.2 var(--hand);letter-spacing:1px;color:var(--paper)}
.hello span{display:block;margin-top:2px;font-size:12.5px;color:var(--haze)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-3deg)}}
h1{margin:0;font:400 34px/1.15 var(--hand);letter-spacing:1px}
.ver{margin-top:10px;color:var(--dim);font-size:12.5px}
/* 账号名册：一行一个账号，不是一堆卡片 */
.roster{margin-top:32px;border:1px solid var(--seam);border-radius:14px;background:var(--ledge);overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(170px,230px) 52px auto;align-items:center;gap:16px;padding:14px 18px;border-top:1px solid var(--seam);animation:rise .32s ease-out both}
.row:first-child{border-top:0}
.row:hover{background:rgba(44,54,63,.45)}
.row.cur{background:rgba(216,176,106,.06)}
.row .mono-av{width:40px;height:40px;font-size:16px;border-radius:11px}
.nm b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px}
.nm small.ok{color:var(--jade)}
.nm small .cur{color:var(--brass);margin-left:6px}
.quota{display:grid;gap:7px}
.q{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:11.5px;color:var(--haze)}
.q em{font-style:normal;color:var(--paper);font-weight:500}
.q .bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--seam);overflow:hidden}
.q .bar i{display:block;height:100%;border-radius:4px;background:var(--jade)}
.q.warn .bar i{background:var(--brass)}.q.hot .bar i{background:var(--rust)}.q.hot em{color:var(--rust)}
.q .rs{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.q .rs b{font-weight:500;color:var(--haze)}
.qmsg{font-size:12px;color:var(--dim)}
.tip{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-radius:12px;border:1px dashed rgba(216,176,106,.45);color:var(--haze);font-size:12.5px}
.tip b{color:var(--paper);font-weight:500}
.qhead{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:22px 2px -18px;font-size:12px;color:var(--dim)}
.qhead button{border:0;background:none;color:var(--brass);cursor:pointer;font-size:12px;padding:2px 4px}
.state{display:flex;align-items:center;gap:8px;color:var(--haze)}
.state.ok{color:var(--jade)}
.key{color:var(--dim);font-size:12px}
.acts{display:flex;align-items:center;gap:2px}
.acts .btn{margin-right:6px;min-width:96px}
.row.off .acts .btn{border-color:rgba(216,176,106,.45);color:var(--brass)}
.empty{padding:48px 24px;text-align:center;color:var(--haze)}
.empty .btn{margin-top:14px}
/* 导入说明：真正的三步顺序 */
.guide{margin-top:28px;display:grid;grid-template-columns:220px 1fr;gap:28px;padding:22px 24px;border-radius:14px;background:var(--raise)}
.guide h2{margin:0 0 6px;font:400 19px/1.3 var(--hand);letter-spacing:.5px}
.guide p{margin:0;color:var(--haze);font-size:12.5px}
.guide ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.guide li{counter-increment:s;position:relative;padding-top:30px;color:var(--haze);font-size:12.5px}
.guide li::before{content:counter(s);position:absolute;top:0;left:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--brass);color:var(--brass);display:grid;place-items:center;font-size:12px;font-weight:500}
.guide li b{display:block;color:var(--paper);font-size:13.5px;font-weight:500;margin-bottom:3px}
code{font-family:inherit;color:var(--paper);background:var(--ledge);padding:1px 5px;border-radius:4px}
/* 信箱：窗口之间 agent 的往来信件 */
.mailbox{margin-top:28px;border:1px solid var(--seam);border-radius:14px;background:var(--ledge);overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--seam)}
.mhead h2{margin:0;font:400 19px/1.3 var(--hand);letter-spacing:.5px;flex:1}
.mhead h2 small{margin-left:10px;font:12px var(--sans,inherit);color:var(--dim);letter-spacing:0}
.mhead button{border:0;background:none;color:var(--brass);cursor:pointer;font-size:12px;padding:2px 4px}
.ml{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 18px;border-top:1px solid var(--seam);font-size:12.5px}
.ml:first-of-type{border-top:0}
.ml time{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
.ml .who{color:var(--paper);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml .who i{font-style:normal;color:var(--dim);margin:0 6px}
.ml .pv{grid-column:2;color:var(--haze);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml .sb{grid-row:1/3;grid-column:3;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--jade)}
.ml .sb.q{color:var(--haze)}.ml .sb.h{color:var(--brass)}.ml .sb.f{color:var(--rust)}
.ml .sb button{border:1px solid var(--seam);background:none;color:var(--paper);border-radius:7px;padding:3px 9px;font-size:11.5px;cursor:pointer}
.mempty{padding:18px;color:var(--haze);font-size:12.5px;line-height:1.7}
@media (max-width:860px){.wrap{padding:28px 20px}.row{grid-template-columns:40px minmax(0,1fr) auto;row-gap:8px}.row .key{display:none}.row .quota{grid-column:2/-1}.row .acts{grid-column:1/-1;justify-content:flex-end}.guide{grid-template-columns:1fr}.guide ol{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
  <header>
    <div><div class="hello" id="hello"><svg class="pic" id="pic" viewBox="0 0 160 100" aria-hidden="true"></svg><div><b id="hiT"></b><span id="hiS"></span></div></div><h1 id="headline">还没有账号</h1><div class="ver" id="ver"></div></div>
    <button class="btn pri" id="addBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加账号</button>
  </header>
  <div id="qtip"></div>
  <section class="roster" id="roster" aria-label="账号列表"></section>
  <section class="mailbox" id="mailbox" aria-label="信箱"></section>
  <section class="guide">
    <div><h2>从 Chrome 导入登录</h2><p>不想在这里输谷歌密码，就在 Chrome 里登录好，再一键带过来。</p></div>
    <ol>
      <li><b>装好插件</b>在 <code>chrome://extensions</code> 打开开发者模式，加载 Hark Cockpit 插件</li>
      <li><b>在 Chrome 登录</b>用要导入的谷歌账号打开 app.hark.com 并登录</li>
      <li><b>点插件导入</b>选好目标账号，需要的话勾上实时同步</li>
    </ol>
  </section>
</div>
<div id="dlg"><div class="box"><div class="t" id="dt"></div><input id="di"><div class="b"><button class="btn" id="dc">取消</button><button class="btn pri" id="dok">确定</button></div></div></div>
<script src="girl-a.js"></script><script src="girl-b.js"></script>
<script>
const TINTS=[['#3B4A5C','#BFD3EA'],['#2F4A47','#A8DCCB'],['#4A3F57','#D6C5EA'],['#55413F','#EBC3B8'],['#504631','#E8D3A2'],['#3C4A35','#C6DDB0']];
const tint=s=>{let h=0;for(const c of s||'')h=(h*31+c.charCodeAt(0))>>>0;return TINTS[h%TINTS.length]};
const I={reload:'<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',del:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'};
const svg=k=>`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
function ask(title,def,cb,withInput=true,okText){dt.textContent=title;di.style.display=withInput?'':'none';di.value=def||'';dlg.style.display='flex';
 dok.textContent=okText||'确定';dok.className='btn '+(withInput?'pri':'danger');if(withInput){di.focus();di.select();}else dok.focus();
 const done=v=>{dlg.style.display='none';dok.onclick=dc.onclick=di.onkeydown=null;if(v!==null)cb(v)};
 dok.onclick=()=>done(withInput?(di.value.trim()||def):true);dc.onclick=()=>done(null);di.onkeydown=e=>{if(e.key==='Enter')dok.click();if(e.key==='Escape')dc.click()};}
let st={accounts:[],activeId:null},animated=false;
const addAcc=()=>ask('给新账号起个名字','Hark '+(st.accounts.length+1),name=>cockpit.add({name}),true,'添加账号');
addBtn.onclick=addAcc;
// 问候插画：照用户头像画的 Q 版小人（插画内嵌为 webp），外面的太阳、月亮、云、热气和 zZ 用 SVG 动画
const GIRL=window.GIRL||{};
const C={sun:'#F2C46D',moon:'#E9DFC4',gold:'#D8B06A'};
const anim=(a,v,d,x='')=>`<animate attributeName="${a}" values="${v}" dur="${d}" repeatCount="indefinite" ${x}/>`;
const spin=(t,v,d,x='')=>`<animateTransform attributeName="transform" type="${t}" values="${v}" dur="${d}" repeatCount="indefinite" ${x}/>`;
const girl=(k,x,y,w,h,motion)=>`<g>${motion}<image href="data:image/webp;base64,${GIRL[k]}" x="${x}" y="${y}" width="${w}" height="${h}"/></g>`;
const star=(x,y,r,d)=>`<path d="M${x} ${y-r}L${x+r*.3} ${y-r*.3}L${x+r} ${y}L${x+r*.3} ${y+r*.3}L${x} ${y+r}L${x-r*.3} ${y+r*.3}L${x-r} ${y}L${x-r*.3} ${y-r*.3}Z" fill="${C.gold}">${anim('opacity','1;.2;1',d)}</path>`;
const rays=(cx,cy,r1,r2,n)=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2;return `<line x1="${cx+Math.cos(a)*r1}" y1="${cy+Math.sin(a)*r1}" x2="${cx+Math.cos(a)*r2}" y2="${cy+Math.sin(a)*r2}"/>`}).join('');
const face=(cx,cy,r,c='#2A2216')=>`<circle cx="${cx-r*.36}" cy="${cy-r*.06}" r="${r*.13}" fill="${c}">${anim('r',`${r*.13};${r*.13};${r*.02};${r*.13}`,'4.5s','keyTimes="0;.92;.96;1"')}</circle><circle cx="${cx+r*.36}" cy="${cy-r*.06}" r="${r*.13}" fill="${c}">${anim('r',`${r*.13};${r*.13};${r*.02};${r*.13}`,'4.5s','keyTimes="0;.92;.96;1"')}</circle><path d="M${cx-r*.22} ${cy+r*.28}q${r*.22} ${r*.24} ${r*.44} 0" stroke="${c}" stroke-width="${r*.13}" fill="none" stroke-linecap="round"/><ellipse cx="${cx-r*.62}" cy="${cy+r*.26}" rx="${r*.18}" ry="${r*.11}" fill="#E8907A" opacity=".8"/><ellipse cx="${cx+r*.62}" cy="${cy+r*.26}" rx="${r*.18}" ry="${r*.11}" fill="#E8907A" opacity=".8"/>`;
const sunAt=(cx,cy,r)=>`<g stroke="${C.sun}" stroke-width="${r*.2}" stroke-linecap="round">${rays(cx,cy,r*1.3,r*1.7,8)}${spin('rotate',`0 ${cx} ${cy};45 ${cx} ${cy}`,'6s')}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.sun}"/>${face(cx,cy,r)}`;
let moonN=0;
const moonAt=(x,y,s,sleep=true)=>{const c='#3A4550';return `<g transform="translate(${x},${y}) scale(${s})"><g>${spin('rotate','-6;6;-6','6s')}
  <path d="M.44-13.99A14 14 0 1 0 13.56 3.49A11 11 0 0 1 .44-13.99Z" fill="${C.moon}"/>
  <circle cx="4" cy="9.5" r="1.4" fill="#D6C9A8"/><circle cx="-6" cy="-7" r="1" fill="#D6C9A8"/>
  ${sleep?`<path d="M-11.5 0q1.8 1.8 3.6 0M-5 2.2q1.8 1.8 3.6 0" stroke="${c}" stroke-width="1.2" fill="none" stroke-linecap="round"/>`:`<circle cx="-9.7" cy=".4" r="1.2" fill="${c}"/><circle cx="-3.2" cy="2.4" r="1.2" fill="${c}"/>`}
  <path d="M-8 5.6q1.4 1.2 2.8 .4" stroke="${c}" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <ellipse cx="-12" cy="4" rx="1.5" ry=".9" fill="#E8907A" opacity=".75"/><ellipse cx="-2" cy="6.4" rx="1.5" ry=".9" fill="#E8907A" opacity=".75"/>
    </g></g>`};
const ground='<path d="M8 93h144" stroke="#4A5560" stroke-width="1.6" stroke-linecap="round"/>';
const steam=(x,y)=>`<g stroke="#C9D6DF" stroke-width="1.1" fill="none" stroke-linecap="round"><path d="M${x} ${y}q-2-3 0-6q2-3 0-6">${anim('opacity','0;.9;0','2.4s')}${spin('translate','0 2;0 -3','2.4s')}</path><path d="M${x+4} ${y}q-2-3 0-6q2-3 0-6">${anim('opacity','0;.9;0','2.4s','begin="1.2s"')}${spin('translate','0 2;0 -3','2.4s','begin="1.2s"')}</path></g>`;
const SCENES={
  morning:{t:'早上好',s:'新的一天，从哪个账号开始？',svg:`${ground}<clipPath id="hz"><rect width="160" height="92"/></clipPath>
    <g clip-path="url(#hz)"><g>${sunAt(36,74,15)}${spin('translate','0 6;0 -2;0 6','6s')}</g></g>
    ${star(66,16,3,'1.6s')}${star(150,30,2.4,'2.1s')}${star(20,28,2,'2.6s')}
    ${girl('morning',74,5,78,88,spin('translate','0 0;0 -4;0 0','1s','calcMode="spline" keyTimes="0;.5;1" keySplines=".3 0 .7 1;.3 0 .7 1"'))}`},
  noon:{t:'中午好',s:'记得吃饭，聊天可以等等',svg:`${ground}${sunAt(36,30,12)}${star(62,58,2,'2s')}
    ${girl('noon',86,5,58.5,88,spin('translate','0 0;0 -1.5;0 0','1.4s'))}`},
  afternoon:{t:'下午好',s:'来杯茶，接着忙',svg:`${ground}${sunAt(34,28,11)}
    <g>${spin('translate','0 0;14 0;0 0','10s')}<path d="M24 62a8 8 0 0 1 3-15.5 11 11 0 0 1 20-2A7.5 7.5 0 0 1 53 62z" fill="#C9D6DF" opacity=".85"/></g>
    ${girl('afternoon',86,9,64,84,spin('rotate','-1.5 118 93;1.5 118 93;-1.5 118 93','4s'))}${steam(101,54)}`},
  evening:{t:'晚上好',s:'今天辛苦了',svg:`<rect x="10" y="12" width="34" height="30" rx="4" fill="#2C363F" stroke="#4A5560" stroke-width="1.6"/>${moonAt(27,27,.85,false)}${star(18,18,1.8,'2.4s')}${star(56,14,2,'3s')}
    <circle cx="101" cy="60" r="9" fill="#FFE7A8" opacity=".25">${anim('opacity','.15;.35;.15','3s')}</circle>
    ${girl('evening',64,3,89,92,spin('translate','0 0;0 -.8;0 0','4s'))}`},
  night:{t:'夜深了',s:'别熬太晚，明天再聊也行',svg:`${moonAt(28,24,.9)}${star(52,14,2.2,'2.2s')}${star(14,46,1.8,'3s')}${star(150,12,1.6,'2.6s')}
    ${girl('night',60,12,96,88,spin('translate','0 0;0 -.8;0 0','3.6s'))}
    <g font-family="sans-serif" font-weight="700" fill="#97A1A8">
      <text x="112" y="30" font-size="9">z${anim('opacity','0;1;0','3s')}${spin('translate','0 6;6 -6','3s')}</text>
      <text x="122" y="20" font-size="12">Z${anim('opacity','0;1;0','3s','begin="1.5s"')}${spin('translate','0 6;6 -6','3s','begin="1.5s"')}</text>
    </g>`},
};
function greet(){const h=new Date().getHours();const k=h<5||h>=23?'night':h<11?'morning':h<14?'noon':h<18?'afternoon':'evening';
  if(greet.k===k)return;greet.k=k;const g=SCENES[k];pic.innerHTML=g.svg;if(matchMedia('(prefers-reduced-motion: reduce)').matches)pic.pauseAnimations();hiT.textContent=g.t;hiS.textContent=g.s;}
greet();setInterval(greet,60000);
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(0)+'K':String(Math.round(n));
const fmtT=t=>{const d=new Date(t);return isNaN(d)?String(t):`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function fmtLeft(t){const ms=new Date(t)-Date.now();if(isNaN(ms))return '';if(ms<=0)return '即将重置';
  const m=Math.floor(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
  return '还剩 '+(d?`${d}天${h}小时`:h?`${h}小时${mm}分`:`${Math.max(mm,1)}分钟`);}
setInterval(()=>{let due=false;document.querySelectorAll('[data-reset]').forEach(el=>{el.textContent=fmtLeft(el.dataset.reset);if(new Date(el.dataset.reset)<=Date.now())due=true});
  if(due&&!fmtLeft.asked){fmtLeft.asked=true;setTimeout(()=>{fmtLeft.asked=false;cockpit.refreshUsage()},60000)}},30000);
function quota(a){
  if(!a.loggedIn)return '<span class="qmsg">登录后显示额度</span>';
  if(!st.usageReady)return '<span class="qmsg">额度待识别</span>';
  const u=a.usage;if(!u)return '<span class="qmsg">正在读取…</span>';
  if(!u.buckets||!u.buckets.length)return `<span class="qmsg">${u.error||'没有额度数据'}</span>`;
  return u.buckets.slice(0,2).map(b=>{const p=b.pct??0,cls=p>=90?'hot':p>=70?'warn':'';
    const val=b.used!=null&&b.limit!=null?`${fmtN(b.used)} / ${fmtN(b.limit)}`:`已用 ${p}%`;
    const t=b.resets?`${fmtT(b.resets)} 重置`:'';
    const rs=b.resets?`<div class="rs"><span>${t}</span><b data-reset="${b.resets}">${fmtLeft(b.resets)}</b></div>`:'';
    return `<div class="q ${cls}" title="${t}"><span>${b.label}</span><em>${val}</em><div class="bar"><i style="width:${p}%"></i></div>${rs}</div>`}).join('');
}
function renderTip(){
  if(!st.accounts.some(a=>a.loggedIn)){qtip.innerHTML='<div class="qhead"><button id="ex3">导出诊断文件</button></div>';ex3.onclick=()=>cockpit.exportDiag();return;}
  if(!st.usageReady){qtip.innerHTML='<div class="tip"><span><b>还没读到额度。</b>先在任一已登录账号里正常聊几句、打开一下设置，再点「导出诊断文件」发给 Hark，用来找到额度数据的来源。文件只含接口地址和字段名，没有聊天内容和登录信息。</span><span style="display:flex;gap:8px"><button class="btn" id="ob">打开账号</button><button class="btn pri" id="ex">导出诊断文件</button></span></div>';ob.onclick=()=>cockpit.openBilling();ex.onclick=()=>cockpit.exportDiag();return;}
  const ts=st.accounts.map(a=>a.usage&&a.usage.at).filter(Boolean);
  qtip.innerHTML=`<div class="qhead"><span>${ts.length?'额度更新于 '+fmtT(Math.max(...ts))+'，':''}每 10 分钟自动刷新</span><button id="rq">立即刷新</button><button id="ex2">导出诊断文件</button></div>`;ex2.onclick=()=>cockpit.exportDiag();
  rq.onclick=()=>{rq.textContent='刷新中…';cockpit.refreshUsage()};
}
function renderMail(){
  const M=st.mail||{letters:[],paused:false},L=[...M.letters].reverse();
  const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  const ST={sent:['已送达',''],queued:['投递中…','q'],fetching:['取附件…','q'],held:['已暂停','h'],failed:['失败','f']};
  mailbox.innerHTML=`<div class="mhead"><h2>信箱<small>${M.paused?'已暂停，新信先存着':'窗口之间的 agent 会自动写信讨论'}</small></h2><button id="mt">教会所有窗口</button><button id="mp">${M.paused?'继续投递':'暂停'}</button>${L.length?'<button id="mc">清空记录</button>':''}</div>`+
    (L.length?'':'<div class="mempty">先点「教会所有窗口」，每个已登录的窗口会收到一份信箱说明。之后在窗口 1 里说「去和窗口 2 讨论一下这部分」，两边的 agent 就会自己写信来回，讨论完由窗口 1 告诉你结果。</div>');
  for(const x of L){const [t,c]=ST[x.status]||[x.status,''];const el=document.createElement('div');el.className='ml';
    el.innerHTML=`<time>${hm(x.at)}</time><div class="who"></div><div class="pv"></div><div class="sb ${c}"><span></span>${x.nfiles?'<button class="fl">📎 '+x.nfiles+'</button>':''}${(x.status==='failed'&&x.to)||x.status==='held'?'<button class="rt">重发</button>':''}</div>`;
    el.querySelector('.who').innerHTML='<span></span><i>→</i><span></span>';const w=el.querySelectorAll('.who span');w[0].textContent=x.fromName;w[1].textContent=x.toName;
    el.querySelector('.pv').textContent=x.teach?'信箱说明':(x.subject?x.subject+'：':'')+(x.preview||'');
    el.querySelector('.sb span').textContent=t+(x.note?'：'+x.note:'');
    const b=el.querySelector('.sb .rt');if(b)b.onclick=()=>cockpit.mailRetry(x.id);
    const f=el.querySelector('.sb .fl');if(f){f.title=(x.fileNames||[]).join('、')+'（打开所在文件夹）';f.onclick=()=>cockpit.mailFiles(x.id);}
    mailbox.appendChild(el);}
  mt.onclick=()=>cockpit.mailTeach();mp.onclick=()=>cockpit.mailPause(!M.paused);if(window.mc)mc.onclick=()=>cockpit.mailClear();
}
function render(){
  renderTip();renderMail();
  const n=st.accounts.length,ok=st.accounts.filter(a=>a.loggedIn).length;
  headline.textContent=!n?'还没有账号':ok===n?`${n} 个账号都已登录`:ok?`${n} 个账号，${ok} 个已登录`:`${n} 个账号，都还没登录`;
  roster.innerHTML='';
  if(!n){roster.innerHTML='<div class="empty">每个账号都有独立的登录，互不影响。<br><button class="btn pri" id="e1">添加第一个账号</button></div>';e1.onclick=addAcc;return;}
  st.accounts.forEach((a,i)=>{
    const [bg,fg]=tint(a.name),cur=a.id===st.activeId;
    const r=document.createElement('div');r.className='row'+(cur?' cur':'')+(a.loggedIn?'':' off');if(animated)r.style.animation='none';else r.style.animationDelay=(i*45)+'ms';
    r.innerHTML=`<div class="mono-av" style="background:${bg};color:${fg}"></div>
      <div class="nm"><b></b><small class="${a.loggedIn?'ok':''}"><span class="lamp ${a.loggedIn?'on':''}"></span>${a.loggedIn?'已登录':'未登录'}${cur?'<span class="cur">上次使用</span>':''}</small></div>
      <div class="quota">${quota(a)}</div>
      <div class="key">${i<9?'Ctrl '+(i+1):''}</div>
      <div class="acts"><button class="btn open">${a.loggedIn?'打开聊天':'去登录'}</button>
      <button class="ib" data-k="reload" title="刷新页面" aria-label="刷新页面">${svg('reload')}</button><button class="ib" data-k="edit" title="重命名" aria-label="重命名">${svg('edit')}</button><button class="ib del" data-k="del" title="删除并清除登录" aria-label="删除并清除登录">${svg('del')}</button></div>`;
    r.querySelector('.mono-av').textContent=(a.name||'H').trim()[0].toUpperCase();r.querySelector('b').textContent=a.name;
    r.querySelector('.open').onclick=()=>cockpit.switchTo(a.id);
    r.querySelector('[data-k=reload]').onclick=()=>cockpit.reload(a.id);
    r.querySelector('[data-k=edit]').onclick=()=>ask('重命名账号',a.name,v=>cockpit.rename(a.id,v));
    r.querySelector('[data-k=del]').onclick=()=>ask(`删除「${a.name}」并清除它的登录？`,'',()=>cockpit.remove(a.id),false,'删除');
    roster.appendChild(r);
  });
  animated=true;
}
cockpit.onState(s=>{st=s;render()});
cockpit.getState().then(s=>{st=s;render()});
cockpit.version().then(v=>ver.textContent='Hark Tools v'+v+'，按 Ctrl 1–9 直接切换账号');
</script></body></html>
