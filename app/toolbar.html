<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net data:; script-src 'unsafe-inline'">
<link rel="stylesheet" href="theme.css">
<style>
body{background:var(--dusk);border-bottom:1px solid var(--seam);display:flex;align-items:center;gap:4px;padding:0 150px 0 12px;overflow:hidden;user-select:none;-webkit-app-region:drag}
button{-webkit-app-region:no-drag}
.ib{width:30px;height:30px}.ib:disabled{opacity:.3;cursor:default;background:none}
.title{display:flex;align-items:center;gap:10px;margin-left:10px;min-width:0}
.title b{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.title span.ok{color:var(--jade)}
.sp{flex:1}
#upd{display:none;height:30px;padding:0 12px;border-radius:8px;border:0;background:var(--brass);color:var(--brass-ink);font-weight:500;cursor:pointer;animation:rise .2s ease-out}
#upd:hover{background:#E3BE7E}
</style></head><body>
<div class="title"><b id="tt">总览</b><span id="ts"></span></div>
<div class="sp"></div>
<button id="upd" title="重启后使用新版本"></button>
<script>
let st={};
function render(){
  const a=(st.accounts||[]).find(x=>x.id===st.activeId),home=st.showHome||!a;
  tt.textContent=home?'总览':a.name;
  ts.innerHTML=home?'':`<span class="lamp ${a.loggedIn?'on':''}"></span>${a.loggedIn?'已登录':'未登录'}`;
  ts.className=!home&&a.loggedIn?'ok':'';
}
cockpit.onUpdate(u=>{if(u.state==='ready'){upd.textContent=`新版本 v${u.version} 已下载，重启更新`;upd.style.display='block';upd.onclick=()=>cockpit.installUpdate();}});
cockpit.onState(s=>{st=s;render()});cockpit.getState().then(s=>{st=s;render()});
</script></body></html>
