<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{--ink:#1D1D1F;--slate:#6E6E73;--line:rgba(0,0,0,.08);--blue:#007AFF;--green:#28A745}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font:13px/1.3 -apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;color:var(--ink);user-select:none;
  background:linear-gradient(180deg,rgba(250,251,253,.96),rgba(243,246,250,.96));border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:0 14px;-webkit-app-region:drag}
button{font:inherit;color:inherit;-webkit-app-region:no-drag}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.seg{display:flex;border-radius:8px;overflow:hidden}
.tb{width:30px;height:28px;border:0;background:transparent;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--slate)}
.tb:hover:not(:disabled){background:rgba(0,0,0,.06);color:var(--ink)}
.tb:disabled{opacity:.3;cursor:default}
.title{margin-left:8px;min-width:0}
.title b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:11px;color:var(--slate)}
.title span.ok{color:var(--green)}
.sp{flex:1}
</style></head><body>
<div class="seg" id="navs">
  <button class="tb" id="back" title="后退"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="tb" id="fwd" title="前进"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div class="title"><b id="tt">总览</b><span id="ts"></span></div>
<div class="sp"></div>
<button class="tb" id="rl" title="刷新页面"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>
<button class="tb" id="ov" title="总览"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg></button>
<script>
let st={};
function render(){
  const a=(st.accounts||[]).find(x=>x.id===st.activeId);
  const home=st.showHome||!a;
  navs.style.visibility=rl.style.visibility=home?'hidden':'visible';
  back.disabled=!st.canBack;fwd.disabled=!st.canForward;
  tt.textContent=home?'总览':a.name;
  ts.textContent=home?`${(st.accounts||[]).length} 个账号`:(a.loggedIn?'已登录':'未登录');
  ts.className=!home&&a.loggedIn?'ok':'';
}
back.onclick=()=>cockpit.nav('back');fwd.onclick=()=>cockpit.nav('forward');
rl.onclick=()=>st.activeId&&cockpit.reload(st.activeId);ov.onclick=()=>cockpit.home();
document.body.addEventListener('dblclick',e=>{if(e.target===document.body||e.target.closest('.title,.sp'))cockpit.win('max')});
cockpit.onState(s=>{st=s;render()});cockpit.getState().then(s=>{st=s;render()});
</script></body></html>
