<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'">
<link rel="stylesheet" href="theme.css">
<style>
body{background:var(--dusk);border-bottom:1px solid var(--seam);display:flex;align-items:center;gap:4px;padding:0 150px 0 12px;overflow:hidden;user-select:none;-webkit-app-region:drag}
button{-webkit-app-region:no-drag}
.ib{width:30px;height:30px}.ib:disabled{opacity:.3;cursor:default;background:none}
.title{display:flex;align-items:center;gap:10px;margin-left:8px;min-width:0}
.title b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.title span.ok{color:var(--jade)}
.sp{flex:1}
</style></head><body>
<button class="ib" id="back" title="后退" aria-label="后退"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="ib" id="fwd" title="前进" aria-label="前进"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="ib" id="rl" title="刷新页面" aria-label="刷新页面"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>
<div class="title"><b id="tt">总览</b><span id="ts"></span></div>
<div class="sp"></div>
<script>
let st={};
function render(){
  const a=(st.accounts||[]).find(x=>x.id===st.activeId),home=st.showHome||!a;
  for(const b of [back,fwd,rl])b.style.display=home?'none':'';
  back.disabled=!st.canBack;fwd.disabled=!st.canForward;
  tt.textContent=home?'总览':a.name;
  ts.innerHTML=home?'':`<span class="lamp ${a.loggedIn?'on':''}"></span>${a.loggedIn?'已登录':'未登录'}`;
  ts.className=!home&&a.loggedIn?'ok':'';
}
back.onclick=()=>cockpit.nav('back');fwd.onclick=()=>cockpit.nav('forward');rl.onclick=()=>st.activeId&&cockpit.reload(st.activeId);
cockpit.onState(s=>{st=s;render()});cockpit.getState().then(s=>{st=s;render()});
</script></body></html>
